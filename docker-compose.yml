version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/var/www/html
      - composer_cache:/root/.composer
    ports:
      - "8081:80"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db/${MYSQL_DATABASE}
      MYSQL_DRIVER: pdo_mysql
      MYSQL_PORT: 3306
      MYSQL_HOST: db
      JWT_SECRET: ${JWT_SECRET}
      API_ENDPOINT: http://localhost:80
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SMTP_HOST: smtp.gmail.com
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c", "composer install --prefer-dist --no-dev --optimize-autoloader && apache2-foreground"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8000:80"
    environment:
      API_URL: https://nomorewaste.koyeb.app/api
    volumes:
      - ./frontend/src:/var/www/html

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  db_data:
    driver: local
  composer_cache:
    driver: local
